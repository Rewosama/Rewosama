<svg xmlns="http://www.w3.org/2000/svg" width="830" height="232" viewBox="0 0 830 232" role="img" aria-label="Contact panel: Discord DM is the only channel">
  <defs>
    <linearGradient id="iglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b232" stop-opacity=".10"/>
      <stop offset="1" stop-color="#f0b232" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1f1f" stop-opacity="0"/>
      <stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:1 } }
    .ring { animation: ring 2.4s ease-in-out infinite; }
    @keyframes ring { 0%,100% { opacity:.10; r:9 } 50% { opacity:.45; r:13 } }
  </style>

  <rect width="830" height="232" fill="#0a0a0a"/>
  <rect x="1" y="37" width="828" height="159" fill="url(#iglow)"/>
  <rect x="0.5" y="0.5" width="829" height="231" fill="none" stroke="#1f1f1f"/>

  <rect x="1" y="1" width="828" height="35" fill="#101010"/>
  <line x1="1" y1="36.5" x2="829" y2="36.5" stroke="#1f1f1f"/>
  <circle cx="20" cy="18" r="4.5" fill="#f0b232"/>
  <circle cx="36" cy="18" r="4.5" fill="#262626"/>
  <circle cx="52" cy="18" r="4.5" fill="#262626"/>
  <text class="mono" x="74" y="23" font-size="12.5" fill="#6a7282" textLength="197" lengthAdjust="spacingAndGlyphs">rewosama@github: ~/contact</text>
  <text class="mono" x="812" y="23" font-size="12.5" fill="#3d4148" text-anchor="end">open</text>

  <text class="mono" x="44" y="72" font-size="14" fill="#f0b232">$</text>
  <text class="mono" x="62" y="72" font-size="14" fill="#e6e6e6" textLength="168" lengthAdjust="spacingAndGlyphs">./contact --channel</text>

  <circle class="ring" cx="55" cy="120" r="9" fill="none" stroke="#f0b232" stroke-width="1.4"/>
  <circle class="pulse" cx="55" cy="120" r="6" fill="#f0b232"/>

  <text class="mono" x="76" y="128" font-size="26" font-weight="700" fill="#ffffff" textLength="156" lengthAdjust="spacingAndGlyphs">Discord DM</text>

  <text class="mono" x="76" y="158" font-size="13" fill="#f0b232" textLength="273" lengthAdjust="spacingAndGlyphs">discord.com/users/609455561129328656</text>

  <text class="mono" x="76" y="184" font-size="11.5" fill="#5a6068" textLength="366" lengthAdjust="spacingAndGlyphs">no email &#183; no contact form &#183; no analytics &#183; no tracking</text>

  <text class="mono" x="812" y="120" font-size="34" fill="#2a2f36" text-anchor="end" textLength="22" lengthAdjust="spacingAndGlyphs">&#8599;</text>

  <rect x="1" y="196" width="828" height="35" fill="#101010"/>
  <line x1="1" y1="195.5" x2="829" y2="195.5" stroke="#1f1f1f"/>
  <rect x="20" y="208" width="26" height="2" fill="url(#fadeL)"/>
  <text class="mono" x="812" y="219" font-size="11.5" fill="#f0b232" text-anchor="end" textLength="120" lengthAdjust="spacingAndGlyphs">click and write &#8594;</text>
</svg>