<svg xmlns="http://www.w3.org/2000/svg" width="270" height="152" viewBox="0 0 270 152" role="img" aria-label="Discord DM — direct line card">
  <style>.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }</style>

  <rect width="270" height="152" fill="#18181b"/>
  <rect x="0.5" y="0.5" width="269" height="151" fill="none" stroke="#27272a"/>

  <text class="mono" x="24" y="32" font-size="10" fill="#10b981" letter-spacing="1.5">DIRECT LINE</text>
  <text class="mono" x="246" y="32" font-size="13" fill="#10b981" text-anchor="end">&#8599;</text>

  <text class="mono" x="24" y="70" font-size="20" font-weight="700" fill="#f4f4f5">Discord DM</text>
  <line x1="24" y1="88" x2="246" y2="88" stroke="#27272a"/>

  <text class="mono" x="24" y="110" font-size="12" fill="#a1a1aa">open a private conversation</text>
  <text class="mono" x="24" y="128" font-size="11" fill="#71717a">no email &#183; no forms &#183; no log</text>
</svg>