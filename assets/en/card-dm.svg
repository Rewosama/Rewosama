<svg xmlns="http://www.w3.org/2000/svg" width="245" height="152" viewBox="0 0 245 152" role="img" aria-label="Discord DM — direct line card">
  <defs>
    <linearGradient id="dglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b232" stop-opacity=".20"/>
      <stop offset="1" stop-color="#f0b232" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sweep { animation: sw 5.5s ease-in-out infinite; animation-delay:1s; }
    @keyframes sw { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  </style>

  <rect width="245" height="152" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="244" height="151" fill="none" stroke="#1f1f1f"/>
  <rect x="1" y="1" width="243" height="60" fill="url(#dglow)"/>
  <rect x="1" y="1" width="243" height="2.5" fill="#f0b232"/>

  <g stroke="#f0b232" stroke-width="1.3" opacity=".5" fill="none">
    <polyline points="11,26 11,11 26,11"/>
    <polyline points="219,11 234,11 234,26"/>
  </g>

  <text class="mono sweep" x="20" y="34" font-size="10" fill="#f0b232" textLength="84" lengthAdjust="spacingAndGlyphs">DIRECT LINE</text>
  <text class="mono" x="20" y="72" font-size="21" font-weight="700" fill="#ffffff" textLength="126" lengthAdjust="spacingAndGlyphs">Discord DM</text>
  <line x1="20" y1="88" x2="225" y2="88" stroke="#1f1f1f"/>
  <text class="mono" x="20" y="110" font-size="11" fill="#8b929c" textLength="178" lengthAdjust="spacingAndGlyphs">open a private conversation</text>
  <text class="mono" x="20" y="128" font-size="11" fill="#5a6068" textLength="178" lengthAdjust="spacingAndGlyphs">no email &#183; no forms &#183; no log</text>
  <text class="mono" x="224" y="34" font-size="13" fill="#f0b232" text-anchor="end">&#8599;</text>
</svg>