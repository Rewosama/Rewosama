<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" role="img" aria-label="Rewosama terminal banner — tasarım gereği anonim">
  <defs>
    <pattern id="hgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1c1c1c"/>
    </pattern>
    <linearGradient id="hscan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00fff9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00fff9" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#00fff9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hbody"><rect x="1" y="37" width="828" height="225"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .gl-c { fill:#00fff9; opacity:.55; animation: glc 6s steps(1,end) infinite; }
    .gl-m { fill:#ff2d95; opacity:.40; animation: glm 6s steps(1,end) infinite; }
    .gl-w { fill:#ffffff; }
    @keyframes glc {
      0%,88%,100% { transform: translate(0,0); }
      90% { transform: translate(-4px,-2px); }
      93% { transform: translate(2px,2px); }
      96% { transform: translate(-2px,1px); }
    }
    @keyframes glm {
      0%,88%,100% { transform: translate(0,0); }
      91% { transform: translate(4px,2px); }
      94% { transform: translate(-3px,-1px); }
      97% { transform: translate(2px,-2px); }
    }
    .scan { animation: scanmove 7s linear infinite; }
    @keyframes scanmove {
      0%   { transform: translateY(-60px); }
      100% { transform: translateY(300px); }
    }
    .cur { animation: blink 1.15s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  </style>

  <rect width="830" height="300" fill="#0a0a0a"/>
  <rect x="1" y="37" width="828" height="225" fill="url(#hgrid)"/>
  <rect x="0.5" y="0.5" width="829" height="299" fill="none" stroke="#1f1f1f"/>

  <rect x="1" y="1" width="828" height="35" fill="#101010"/>
  <line x1="1" y1="36.5" x2="829" y2="36.5" stroke="#1f1f1f"/>
  <circle cx="20" cy="18" r="4.5" fill="#00fff9"/>
  <circle cx="36" cy="18" r="4.5" fill="#262626"/>
  <circle cx="52" cy="18" r="4.5" fill="#262626"/>
  <text class="mono" x="74" y="23" font-size="12.5" fill="#6a7282" textLength="188" lengthAdjust="spacingAndGlyphs">rewosama@github: ~/kimlik</text>
  <text class="mono" x="812" y="23" font-size="12.5" fill="#3d4148" text-anchor="end">bash — 80x24</text>

  <g stroke="#00fff9" stroke-width="1.4" opacity=".5" fill="none">
    <polyline points="14,52 14,40 26,40"/>
    <polyline points="804,40 816,40 816,52"/>
    <polyline points="14,247 14,259 26,259"/>
    <polyline points="804,259 816,259 816,247"/>
  </g>

  <g clip-path="url(#hbody)">
    <text class="mono" x="46" y="88" font-size="15" fill="#00fff9">$</text>
    <text class="mono" x="62" y="88" font-size="15" fill="#e6e6e6" textLength="178" lengthAdjust="spacingAndGlyphs">./kimlik --public</text>
    <rect class="cur" x="248" y="76" width="9" height="15" fill="#00fff9"/>

    <text class="mono gl-c" x="44" y="174" font-size="68" font-weight="700" textLength="326" lengthAdjust="spacingAndGlyphs">REWOSAMA</text>
    <text class="mono gl-m" x="44" y="174" font-size="68" font-weight="700" textLength="326" lengthAdjust="spacingAndGlyphs">REWOSAMA</text>
    <text class="mono gl-w" x="44" y="174" font-size="68" font-weight="700" textLength="326" lengthAdjust="spacingAndGlyphs">REWOSAMA</text>

    <text class="mono" x="46" y="208" font-size="13.5" fill="#8b929c" textLength="616" lengthAdjust="spacingAndGlyphs">tasarım gereği anonim — siteler, botlar ve mirror'lar tek kullanıcı adında.</text>

    <g class="mono" font-size="12.5">
      <text x="46" y="243" fill="#00fff9">&#9656;</text>
      <text x="68" y="243" fill="#cfd3d8" textLength="68" lengthAdjust="spacingAndGlyphs">rewou.me</text>
      <text x="176" y="243" fill="#00fff9">&#9656;</text>
      <text x="198" y="243" fill="#cfd3d8" textLength="98" lengthAdjust="spacingAndGlyphs">bot.rewou.me</text>
      <text x="346" y="243" fill="#00fff9">&#9656;</text>
      <text x="368" y="243" fill="#cfd3d8" textLength="173" lengthAdjust="spacingAndGlyphs">discord / doğrudan hat</text>
    </g>

    <rect class="scan" x="1" y="-60" width="828" height="60" fill="url(#hscan)"/>
  </g>

  <rect x="1" y="263" width="828" height="36" fill="#101010"/>
  <line x1="1" y1="262.5" x2="829" y2="262.5" stroke="#1f1f1f"/>
  <circle class="pulse" cx="22" cy="281" r="4.5" fill="#00fff9"/>
  <text class="mono" x="36" y="286" font-size="12" fill="#6a7282" textLength="115" lengthAdjust="spacingAndGlyphs">durum: çevrimiçi</text>
  <text class="mono" x="812" y="286" font-size="12" fill="#3d4148" text-anchor="end" textLength="223" lengthAdjust="spacingAndGlyphs">rewou.me — gerçek isim eklenmemiş</text>
</svg>