<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" role="img" aria-label="Rewosama — tasarım gereği anonim">
  <style>
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  </style>

  <rect width="830" height="300" fill="#09090b"/>
  <rect x="1" y="1" width="828" height="47" fill="#18181b"/>
  <rect x="1" y="252" width="828" height="47" fill="#18181b"/>
  <rect x="0.5" y="0.5" width="829" height="299" fill="none" stroke="#27272a"/>
  <line x1="1" y1="47.5" x2="829" y2="47.5" stroke="#27272a"/>
  <line x1="1" y1="252.5" x2="829" y2="252.5" stroke="#27272a"/>

  <rect x="48" y="17" width="14" height="14" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <rect x="52" y="21" width="6" height="6" fill="#10b981"/>
  

  <rect x="268" y="11" width="294" height="26" fill="#09090b" stroke="#27272a"/>
  <circle cx="284" cy="23" r="4" fill="none" stroke="#71717a" stroke-width="1.5"/>
  <line x1="287" y1="26" x2="291" y2="30" stroke="#71717a" stroke-width="1.5"/>
  <text class="mono" x="300" y="27.5" font-size="11" fill="#71717a">ara&#8230;</text>
  <rect x="524" y="16" width="30" height="16" fill="none" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 2"/>
  <text class="mono" x="539" y="27.5" font-size="9" fill="#71717a" text-anchor="middle">&#8984;K</text>

  <g stroke="#71717a" stroke-width="1.5">
    <line x1="762" y1="19" x2="782" y2="19"/>
    <line x1="762" y1="24" x2="782" y2="24"/>
    <line x1="762" y1="29" x2="782" y2="29"/>
  </g>
  <rect x="763" y="16" width="10" height="6" fill="#18181b"/>
  <rect x="765" y="18" width="6" height="2" fill="#10b981"/>
  <rect x="769" y="21" width="10" height="6" fill="#18181b"/>
  <rect x="771" y="23" width="6" height="2" fill="#10b981"/>
  <rect x="772" y="26" width="10" height="6" fill="#18181b"/>
  <rect x="774" y="28" width="6" height="2" fill="#10b981"/>

  <text class="mono" x="48" y="78" font-size="11" fill="#10b981" letter-spacing="1.65">TASARIM GERE&#304;&#304; ANON&#304;M</text>
  <text class="mono" x="48" y="144" font-size="58" font-weight="700" fill="#f4f4f5" letter-spacing="3.48">REWOSAMA</text>
  <line x1="48" y1="170" x2="782" y2="170" stroke="#27272a"/>
  <text class="mono" x="48" y="202" font-size="14" fill="#a1a1aa">tasar&#305;m gere&#287;i anonim &#8212; siteler, botlar ve mirror'lar tek kullan&#305;c&#305; ad&#305;nda.</text>

  <g class="mono" font-size="13">
    <text x="48" y="226" fill="#10b981">&#9656;</text>
    <text x="68" y="226" fill="#f4f4f5">rewou.me</text>
    <text x="158" y="226" fill="#10b981">&#9656;</text>
    <text x="178" y="226" fill="#f4f4f5">bot.rewou.me</text>
    <text x="299" y="226" fill="#10b981">&#9656;</text>
    <text x="319" y="226" fill="#f4f4f5">discord / do&#287;rudan hat</text>
  </g>

  <circle class="pulse" cx="56" cy="276" r="4" fill="#10b981"/>
  <text class="mono" x="70" y="280" font-size="11" fill="#a1a1aa" letter-spacing="1.1">DURUM: &#199;EVR&#304;M&#304;&#199;&#304;</text>
  <text class="mono" x="782" y="280" font-size="11" fill="#71717a" text-anchor="end">ger&#231;ek isim eklenmemi&#351;</text>
</svg>