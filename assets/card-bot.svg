<svg xmlns="http://www.w3.org/2000/svg" width="245" height="152" viewBox="0 0 245 152" role="img" aria-label="bot.rewou.me — RewoBot Discord yönetim paneli kartı">
  <defs>
    <linearGradient id="bglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5865f2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5865f2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sweep { animation: sw 5.5s ease-in-out infinite; animation-delay:.5s; }
    @keyframes sw { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  </style>

  <rect width="245" height="152" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="244" height="151" fill="none" stroke="#1f1f1f"/>
  <rect x="1" y="1" width="243" height="60" fill="url(#bglow)"/>
  <rect x="1" y="1" width="243" height="2.5" fill="#5865f2"/>

  <g stroke="#5865f2" stroke-width="1.3" opacity=".5" fill="none">
    <polyline points="11,26 11,11 26,11"/>
    <polyline points="219,11 234,11 234,26"/>
  </g>

  <text class="mono sweep" x="20" y="34" font-size="10" fill="#8b93ff" textLength="137" lengthAdjust="spacingAndGlyphs">DISCORD BOT &#183; v2.0</text>
  <text class="mono" x="20" y="72" font-size="21" font-weight="700" fill="#ffffff" textLength="182" lengthAdjust="spacingAndGlyphs">bot.rewou.me</text>
  <line x1="20" y1="88" x2="225" y2="88" stroke="#1f1f1f"/>
  <text class="mono" x="20" y="110" font-size="11" fill="#8b929c" textLength="158" lengthAdjust="spacingAndGlyphs">RewoBot &#183; yönetim paneli</text>
  <text class="mono" x="20" y="128" font-size="11" fill="#5a6068" textLength="158" lengthAdjust="spacingAndGlyphs">güvenlik &#183; ekonomi &#183; ses</text>
  <text class="mono" x="224" y="34" font-size="13" fill="#8b93ff" text-anchor="end">&#8599;</text>
</svg>